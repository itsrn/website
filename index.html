<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ron</title>
<meta name="description" content="Ron — backend dev, reverse engineering, encryption tinkering.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23E95420%22/></svg>">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #ededed;
    --muted: #888;
    --accent: #E95420;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Ubuntu Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 2.75rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  h1 .dot { color: var(--accent); }

  p.tagline {
    margin-top: 14px;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
  }

  .links {
    margin-top: 36px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .links a {
    color: var(--fg);
    text-decoration: none;
    border: 1px solid #2a2a2a;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.9rem;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    margin-top: 48px;
    color: #444;
    font-size: 0.75rem;
  }

  @media (max-width: 420px) {
    .links a { font-size: 0.85rem; padding: 7px 14px; }
  }
</style>
</head>
<body>

  <main>
    <h1>ron<span class="dot">.</span></h1>
    <p class="tagline">backend dev. reverse engineering &amp; encryption on the side.</p>

    <div class="links">
      <a href="mailto:contact@ron.localplayer.dev">email</a>
      <a href="https://github.com/itsrn" target="_blank" rel="noopener">github</a>
    </div>

    <footer>&copy; 2026 ron</footer>
  </main>

</body>
</html>
